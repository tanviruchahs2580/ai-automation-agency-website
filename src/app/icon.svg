<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ARKYON approved symbol on the app-icon backing. Fixed colours: favicons
       cannot read CSS tokens or page themes, and the dark rounded square is
       the standard app-icon treatment (in-site lockups stay transparent). -->
  <defs>
    <linearGradient id="l" x1="32" y1="8" x2="20" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a34"/>
      <stop offset="0.55" stop-color="#e06c1c"/>
      <stop offset="1" stop-color="#9c4708"/>
    </linearGradient>
    <linearGradient id="r" x1="44" y1="8" x2="50" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#57524c"/>
      <stop offset="1" stop-color="#a49e95"/>
    </linearGradient>
    <linearGradient id="o" x1="2" y1="34" x2="60" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a34" stop-opacity="0.15"/>
      <stop offset="0.4" stop-color="#ff9a4d" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffe7cd"/>
    </linearGradient>
    <radialGradient id="d">
      <stop offset="0" stop-color="#ffb066" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffb066" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0f0d0c"/>
  <!-- A: apex (30,6) baseline 60, counter apex (30,32), faces split on the ridge -->
  <path d="M30 6 L30 32 L42 60 L56 60 Z" fill="url(#r)" stroke="url(#r)" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M30 6 L4 60 L16 60 L30 32 Z" fill="url(#l)" stroke="url(#l)" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- orbit: from mid-left, around the bottom-left, up to the glowing endpoint -->
  <path d="M3 32 C1 48 9 60 22 61 C39 62 55 44 60 18" stroke="url(#o)" stroke-width="3.4" stroke-linecap="round" opacity="0.22" fill="none"/>
  <path d="M3 32 C1 48 9 60 22 61 C39 62 55 44 60 18" stroke="url(#o)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <circle cx="60" cy="18" r="4.4" fill="url(#d)"/>
  <circle cx="60" cy="18" r="1.8" fill="#fff3e4"/>
</svg>
