name: CI

# ---------------------------------------------------------------------------
# Continuous Integration pipeline.
#
# Scope of the guarantee, stated accurately: this workflow fails the build on
# anything it checks, and the branch-protection rule on `main` makes its status
# a required check. It does NOT, by itself, prevent a deploy — CD is Vercel's
# GitHub integration, which deploys `main` on push. Previous wording here
# claimed the workflow "guarantees that only code which passes ... is shipped",
# which was not true of any mechanism in this repository. To make it true, gate
# the Vercel project on this check (Vercel → Settings → Git → Ignored Build
# Step, or a deployment-protection rule) — the comment cannot do it from here.
#
# What runs: production-dependency audit, lint, unit tests, production build,
# type-checking, rendered-output invariants, performance budgets, then full
# cross-engine E2E.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede PR runs, never a run on main.
  #
  # Superseding is right for a pull request: a newer push makes the previous run
  # pointless, and re-running is cheap. It is wrong for main, which is the deploy
  # branch — cancelling there means a merged commit's E2E pass never completed.
  # That happened on the merge of #19: a concurrent Dependabot run on main took
  # the concurrency slot and cancelled the E2E job, so the deployed commit was
  # verified only by the pull request's run. Identical trees (both
  # 6f18c6e5), so the coverage was real — but that was luck, not design.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Audit · Lint · Test · Build · Typecheck · Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run check:deps

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Rendered-output invariants
        run: npm run check:rendered

      - name: JavaScript and CSS budgets
        run: npm run check:budget

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | sed 's/[^0-9.]//g')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
          restore-keys: |
            pw-${{ runner.os }}-

      - name: Install Playwright browsers + OS deps
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Production build
        run: npm run build

      - name: Rendered-output invariants
        run: npm run check:rendered

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            test-results/
          retention-days: 7
